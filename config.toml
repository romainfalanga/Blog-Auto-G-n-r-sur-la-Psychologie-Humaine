baseURL = "https://decodetonesprit.fr/"
languageCode = "fr"
defaultContentLanguage = "fr"
title = "Décode ton esprit — Comprends-toi grâce à la psychologie"

[params]
  description = "Un blog de psychologie vulgarisée pour mieux se comprendre soi-même. Découvrez vos biais cognitifs, apprenez à gérer vos émotions et libérez-vous de vos schémas répétitifs."
  author = "Décode ton esprit"
  siteName = "Décode ton esprit"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "friendly"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.RSS]
    mediaType = "application/rss+xml"
    baseName = "feed"

[sitemap]
  changefreq = "daily"
  priority = 0.5
  filename = "sitemap.xml"

[taxonomies]
  category = "categories"
  tag = "tags"

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/:sections/:slug/"
  personnages = "/personnages/:slug/"

[menu]
  [[menu.main]]
    name = "Accueil"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Nos personnages"
    url = "/personnages/"
    weight = 2
  [[menu.main]]
    name = "Mes histoires"
    url = "/mes-histoires/"
    weight = 3
  [[menu.main]]
    name = "Mes articles aimés"
    url = "/mes-articles/"
    weight = 4
  [[menu.main]]
    name = "Mon portrait"
    url = "/mon-portrait/"
    weight = 5
  [[menu.main]]
    name = "Mon compte"
    url = "/mon-compte/"
    weight = 6

enableRobotsTXT = true
