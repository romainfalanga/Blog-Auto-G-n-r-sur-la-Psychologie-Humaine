# Lot P : script et style de l’application, publics et nommés par leur contenu (/app/<empreinte>.js|.css).
# Identiques pour tous les comptes ; la page privée qui les appelle reste « private, no-store ».
# Le Worker fixe lui-même le cache immuable (200) ou « no-store » (nom inconnu) : pas de règle [[headers]] ici.
[[redirects]]
  from = "/app/*"
  to = "https://decode-journal.romainfalanga83.workers.dev/app/:splat"
  status = 200
  force = true

[[headers]]
  for = "/mes-personnages"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mes-personnages/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/journal"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mes-histoires"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mes-histoires/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mes-articles"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mes-articles/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mon-portrait"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mon-portrait/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mon-compte"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mon-compte/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/journal/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), on-device-speech-recognition=(self)"
    X-XSS-Protection = "1; mode=block"

# Cache longue durée pour les assets statiques
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Lot P : chaque script est appelé avec ?v=<empreinte du contenu> (head.html) et l’index de
# recherche des personnages porte son empreinte dans son nom ; un test refuse toute référence
# /js/ sans version dans les gabarits.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fichier llms.txt
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/mon-accompagnement"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mon-accompagnement/*"
  [headers.values]
    Cache-Control = "private, no-store"

