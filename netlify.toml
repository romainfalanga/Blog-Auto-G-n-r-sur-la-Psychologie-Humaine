[build]
  publish = "public"
  command = "node scripts/build_navigation.mjs --check && python3 scripts/build_article_intros.py && hugo --minify"

[build.environment]
  HUGO_VERSION = "0.140.0"
  HUGO_ENV = "production"

# Redirection www -> non-www
[[redirects]]
  from = "https://www.decodetonesprit.fr/*"
  to = "https://decodetonesprit.fr/:splat"
  status = 301
  force = true

# L’ancienne liste est désormais la section principale de l’accueil.
[[redirects]]
  from = "/personnages"
  to = "/#personnages"
  status = 301
  force = true

[[redirects]]
  from = "/personnages/page/*"
  to = "/#personnages"
  status = 301
  force = true

[[redirects]]
  from = "/mon-accompagnement"
  to = "https://decode-journal.romainfalanga83.workers.dev/mon-accompagnement/"
  status = 200
  force = true

[[redirects]]
  from = "/mon-accompagnement/*"
  to = "https://decode-journal.romainfalanga83.workers.dev/mon-accompagnement/:splat"
  status = 200
  force = true

# Nettoie les paramètres avant les règles de proxy, qui les transmettent automatiquement.
[[edge_functions]]
  pattern = "^/(mon-personnage|mes-personnages|mes-histoires|journal)(/.*)?$"
  function = "legacy-private-pages"

[[redirects]]
  from = "/mon-personnage"
  to = "https://decode-journal.romainfalanga83.workers.dev/mon-personnage/"
  status = 200
  force = true

[[redirects]]
  from = "/mon-personnage/*"
  to = "https://decode-journal.romainfalanga83.workers.dev/mon-personnage/:splat"
  status = 200
  force = true

[[headers]]
  for = "/mon-personnage"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mon-personnage/*"
  [headers.values]
    Cache-Control = "private, no-store"

