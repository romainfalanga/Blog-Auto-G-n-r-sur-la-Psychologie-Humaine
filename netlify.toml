[build]
  publish = "public"
  command = "node scripts/build_navigation.mjs --check && node scripts/build_cartographie_module.mjs --check && python3 scripts/build_symptomes_carte.py --check && hugo --minify"

[build.environment]
  HUGO_VERSION = "0.140.0"
  HUGO_ENV = "production"

# Personal data is assembled per request, never stored in the public CDN cache.
[[edge_functions]]
  path = "/cartographie"
  function = "personal-page-data"

[[edge_functions]]
  path = "/cartographie/"
  function = "personal-page-data"

# Redirection www -> non-www
[[redirects]]
  from = "https://www.decodetonesprit.fr/*"
  to = "https://decodetonesprit.fr/:splat"
  status = 301
  force = true

# L’accueil ouvre le tableau de bord (/accueil/), d’où partent toutes les pages : il n’y a plus de menu.
# 302 (temporaire) et force : la page d’accueil Hugo existe et serait sinon servie.
[[redirects]]
  from = "/"
  to = "/accueil/"
  status = 302
  force = true

# Anciennes adresses du catalogue public (personnages, articles, flux) : elles renvoient vers Ambre.
[[redirects]]
  from = "/personnages"
  to = "/ambre/"
  status = 301
  force = true

[[redirects]]
  from = "/personnages/*"
  to = "/ambre/"
  status = 301
  force = true

[[redirects]]
  from = "/posts"
  to = "/ambre/"
  status = 301
  force = true

[[redirects]]
  from = "/posts/*"
  to = "/ambre/"
  status = 301
  force = true

[[redirects]]
  from = "/feed.xml"
  to = "/ambre/"
  status = 301
  force = true

[[redirects]]
  from = "/index.xml"
  to = "/ambre/"
  status = 301
  force = true

# Ancienne adresse d’Ambre : elle renvoie vers /ambre/.
[[redirects]]
  from = "/mon-accompagnement"
  to = "/ambre/"
  status = 301
  force = true

[[redirects]]
  from = "/mon-accompagnement/*"
  to = "/ambre/"
  status = 301
  force = true

[[redirects]]
  from = "/ambre"
  to = "https://decode-journal.romainfalanga83.workers.dev/ambre/"
  status = 200
  force = true

[[redirects]]
  from = "/ambre/*"
  to = "https://decode-journal.romainfalanga83.workers.dev/ambre/:splat"
  status = 200
  force = true

# Nettoie les paramètres avant les règles de proxy, qui les transmettent automatiquement.
[[edge_functions]]
  pattern = "^/(mon-personnage|mes-personnages|mes-histoires|journal)(/.*)?$"
  function = "legacy-private-pages"

[[redirects]]
  from = "/mon-personnage"
  to = "https://decode-journal.romainfalanga83.workers.dev/mon-personnage/"
  status = 200
  force = true

[[redirects]]
  from = "/mon-personnage/*"
  to = "https://decode-journal.romainfalanga83.workers.dev/mon-personnage/:splat"
  status = 200
  force = true

[[headers]]
  for = "/mon-personnage"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mon-personnage/*"
  [headers.values]
    Cache-Control = "private, no-store"

# Ambre s’ouvre depuis « / » (redirection ci-dessus) et depuis le premier lien du menu.

