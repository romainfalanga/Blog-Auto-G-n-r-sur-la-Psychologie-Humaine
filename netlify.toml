[build]
  publish = "public"
  command = "hugo --minify"

[build.environment]
  HUGO_VERSION = "0.140.0"
  HUGO_ENV = "production"

# Redirection www -> non-www
[[redirects]]
  from = "https://www.decodetonesprit.fr/*"
  to = "https://decodetonesprit.fr/:splat"
  status = 301
  force = true

# Netlify normalise les slashs : une redirection /journal -> /journal/
# renvoie aussi /journal/ vers lui-même. Les deux formes sont donc proxifiées.
[[redirects]]
  from = "/journal"
  to = "https://decode-journal.romainfalanga83.workers.dev/journal/"
  status = 200
  force = true

# Le journal fait partie du site existant. Cloudflare ne sert que son backend.
[[redirects]]
  from = "/journal/*"
  to = "https://decode-journal.romainfalanga83.workers.dev/journal/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://decode-journal.romainfalanga83.workers.dev/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/journal/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

# Cache longue durée pour les assets statiques
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fichier llms.txt
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
