[build]
  publish = "public"
  command = "python3 scripts/build_article_intros.py && hugo --minify"

[build.environment]
  HUGO_VERSION = "0.140.0"
  HUGO_ENV = "production"

# Redirection www -> non-www
[[redirects]]
  from = "https://www.decodetonesprit.fr/*"
  to = "https://decodetonesprit.fr/:splat"
  status = 301
  force = true

# L’ancienne liste est désormais la section principale de l’accueil.
[[redirects]]
  from = "/personnages"
  to = "/#personnages"
  status = 301
  force = true

[[redirects]]
  from = "/personnages/page/*"
  to = "/#personnages"
  status = 301
  force = true

# Routes personnelles : proxifier les deux formes sans redirection de slash.
[[redirects]]
  from = "/mes-personnages"
  to = "https://decode-journal.romainfalanga83.workers.dev/mes-personnages/"
  status = 200
  force = true

[[redirects]]
  from = "/mes-personnages/*"
  to = "https://decode-journal.romainfalanga83.workers.dev/mes-personnages/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/mes-histoires"
  to = "https://decode-journal.romainfalanga83.workers.dev/mes-histoires/"
  status = 200
  force = true

[[redirects]]
  from = "/mes-histoires/*"
  to = "https://decode-journal.romainfalanga83.workers.dev/mes-histoires/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/mes-articles"
  to = "https://decode-journal.romainfalanga83.workers.dev/mes-articles/"
  status = 200
  force = true

[[redirects]]
  from = "/mes-articles/*"
  to = "https://decode-journal.romainfalanga83.workers.dev/mes-articles/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/mon-portrait"
  to = "https://decode-journal.romainfalanga83.workers.dev/mon-portrait/"
  status = 200
  force = true

[[redirects]]
  from = "/mon-portrait/*"
  to = "https://decode-journal.romainfalanga83.workers.dev/mon-portrait/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/mon-compte"
  to = "https://decode-journal.romainfalanga83.workers.dev/mon-compte/"
  status = 200
  force = true

[[redirects]]
  from = "/mon-compte/*"
  to = "https://decode-journal.romainfalanga83.workers.dev/mon-compte/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/journal"
  to = "https://decode-journal.romainfalanga83.workers.dev/journal/"
  status = 200
  force = true

[[redirects]]
  from = "/journal/*"
  to = "https://decode-journal.romainfalanga83.workers.dev/journal/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://decode-journal.romainfalanga83.workers.dev/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/mes-personnages"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mes-personnages/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/journal"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mes-histoires"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mes-histoires/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mes-articles"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mes-articles/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mon-portrait"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mon-portrait/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mon-compte"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mon-compte/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/journal/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

# Cache longue durée pour les assets statiques
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fichier llms.txt
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
