[build]
  publish = "public"
  command = "node scripts/build_navigation.mjs --check && node scripts/build_cartographie_module.mjs --check && python3 scripts/build_article_intros.py --check && python3 scripts/check_original_article_structure.py --audit editorial/reviews/originaux-v24.json --require-reviewed && python3 scripts/build_coverage_status.py --check && python3 scripts/build_symptomes_carte.py --check && hugo --minify"

[build.environment]
  HUGO_VERSION = "0.140.0"
  HUGO_ENV = "production"

# Personal data is assembled per request, never stored in the public CDN cache.
[[edge_functions]]
  path = "/cartographie"
  function = "personal-page-data"

[[edge_functions]]
  path = "/cartographie/"
  function = "personal-page-data"

# Redirection www -> non-www
[[redirects]]
  from = "https://www.decodetonesprit.fr/*"
  to = "https://decodetonesprit.fr/:splat"
  status = 301
  force = true

# L’accueil ouvre Ambre ; le catalogue public des personnages reste à /personnages/.
# 302 (temporaire) et force : la page d’accueil Hugo existe et serait sinon servie.
[[redirects]]
  from = "/"
  to = "/mon-accompagnement/"
  status = 302
  force = true


[[redirects]]
  from = "/personnages/page/*"
  to = "/personnages/"
  status = 301
  force = true

[[redirects]]
  from = "/mon-accompagnement"
  to = "https://decode-journal.romainfalanga83.workers.dev/mon-accompagnement/"
  status = 200
  force = true

[[redirects]]
  from = "/mon-accompagnement/*"
  to = "https://decode-journal.romainfalanga83.workers.dev/mon-accompagnement/:splat"
  status = 200
  force = true

# Nettoie les paramètres avant les règles de proxy, qui les transmettent automatiquement.
[[edge_functions]]
  pattern = "^/(mon-personnage|mes-personnages|mes-histoires|journal)(/.*)?$"
  function = "legacy-private-pages"

[[redirects]]
  from = "/mon-personnage"
  to = "https://decode-journal.romainfalanga83.workers.dev/mon-personnage/"
  status = 200
  force = true

[[redirects]]
  from = "/mon-personnage/*"
  to = "https://decode-journal.romainfalanga83.workers.dev/mon-personnage/:splat"
  status = 200
  force = true

[[headers]]
  for = "/mon-personnage"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mon-personnage/*"
  [headers.values]
    Cache-Control = "private, no-store"

# Ambre s’ouvre depuis « / » (redirection ci-dessus) et depuis le premier lien du menu.

# The symptoms map uses Hugo and the same private bootstrap as Mon enfance.
[[edge_functions]]
  path = "/mes-symptomes"
  function = "personal-page-data"

[[edge_functions]]
  path = "/mes-symptomes/"
  function = "personal-page-data"

[[headers]]
  for = "/mes-symptomes"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/mes-symptomes/*"
  [headers.values]
    Cache-Control = "private, no-store"

