name: Génération quotidienne d’articles (version personnalisée)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-articles.yml'
      - 'scripts/generate_personal_articles.py'

permissions:
  contents: read
  id-token: write

concurrency:
  group: journal-personnel-generation
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances du générateur historique
        run: pip install -r scripts/requirements.txt
      - name: Adapter le pipeline historique aux portraits et articles privés
        env:
          JOURNAL_URL: https://decodetonesprit.fr
        run: python scripts/run_journals.py
