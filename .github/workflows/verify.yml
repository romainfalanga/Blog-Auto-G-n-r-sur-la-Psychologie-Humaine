name: Vérifications du site et du journal
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: node scripts/build_navigation.mjs --check
      - run: node scripts/build_psychology_catalog.mjs --check
      - run: python scripts/build_article_intros.py --check
      - run: python scripts/build_examples.py --check
      - run: python scripts/clinical_editorial.py check
      - run: python scripts/check_editorial_pack.py
      - run: python scripts/integrate_editorial_pack.py --check
      - run: python scripts/check_original_article_structure.py --audit editorial/reviews/originaux-v24.json --require-reviewed
      - run: python scripts/build_coverage_status.py --check
      - run: node --test tests/*.test.cjs
      - run: npm --prefix journal test
      - run: python -m unittest discover -s journal/tests -p 'test_personal*.py'
      - run: python -m unittest discover -s tests -p 'test_*pipeline.py'
      - run: python -m unittest discover -s tests -p 'test_clinical_agent_contracts.py'
