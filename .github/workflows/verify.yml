name: Vérifications du site et du journal
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: node scripts/build_navigation.mjs --check
      - run: node --test tests/*.test.cjs
      - run: npm --prefix journal test
      - run: python -m unittest discover -s journal/tests -p 'test_personal*.py'
