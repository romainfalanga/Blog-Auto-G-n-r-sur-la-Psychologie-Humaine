name: Journal personnel quotidien

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: journal-personnel-generation
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer les journaux privés éligibles
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAMMOUTH_API_KEY: ${{ secrets.MAMMOUTH_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.JOURNAL_OPENROUTER_MODEL }}
          JOURNAL_URL: https://decode-journal.romainfalanga83.workers.dev
        run: python scripts/generate_journals.py
