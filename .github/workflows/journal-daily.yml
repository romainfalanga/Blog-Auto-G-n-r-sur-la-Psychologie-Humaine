name: Relance des journaux Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: journal-personnel-generation
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Relancer les journaux privés éligibles via Cloudflare
        env:
          JOURNAL_URL: https://decodetonesprit.fr
        run: python scripts/run_journals.py
