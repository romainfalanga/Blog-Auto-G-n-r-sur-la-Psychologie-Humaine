<!DOCTYPE html>
<html lang="fr">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}home-page{{ else if and .IsPage (eq .Section "posts") }}reading-page{{ end }}">
  <a class="skip-link" href="#main-content">Aller au contenu</a>
  {{ partial "header.html" . }}
  <main id="main-content" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
