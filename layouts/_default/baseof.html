<!DOCTYPE html>
<html lang="fr">
<head>
  {{ partial "head.html" . }}
  {{ block "head-end" . }}{{ end }}
  <link rel="stylesheet" href="/css/ambre-widget.css?v={{ md5 (readFile "static/css/ambre-widget.css") }}">
  <script src="/js/ambre-widget.js?v={{ md5 (readFile "static/js/ambre-widget.js") }}" async></script>
</head>
<body class="{{ if or .IsHome (and (eq .Kind "section") (eq .Section "personnages")) }}home-page{{ else if and .IsPage (eq .Section "posts") }}reading-page{{ end }}">
  <a class="skip-link" href="#main-content">Aller au contenu</a>
  {{ partial "header.html" . }}
  <main id="main-content" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
