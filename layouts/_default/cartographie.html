{{ define "main" }}
<link rel="stylesheet" href="/css/cartographie.css?v={{ readFile "static/css/cartographie.css" | md5 }}">
{{ $data := .Site.Data.cartographie }}
{{ if not $data }}<div class="container-wide carto"><h1>Mon enfance</h1><p>Cette page est en cours de préparation.</p></div>{{ else }}
<div class="container-wide carto" data-cartographie-app data-view="form" data-loading="true" aria-busy="true">
  <header class="carto-intro">
    <h1>Mon enfance</h1>
  </header>

  <div class="carto-tabs" role="tablist" aria-label="Sections de Mon enfance">
    <button type="button" role="tab" data-tab="form" aria-selected="true" disabled>Mon enfance</button>
    <button type="button" role="tab" data-tab="results" aria-selected="false" disabled>Ce qui en ressort</button>
  </div>

  <p class="carto-loading" data-loading-status role="status">Chargement de Mon enfance…</p>

  <div class="carto-save" data-save></div>

  <p class="carto-live" data-count role="status" aria-live="polite" aria-atomic="true"></p>

  <div class="carto-layout">
    <section class="carto-pane carto-pane-form" data-pane-form aria-label="Mon enfance">
      <div class="carto-form-body" data-form-body></div>
    </section>
    <section class="carto-pane carto-pane-results" data-pane-results aria-label="Ce qui en ressort">
      <div data-results></div>
      <p class="carto-scope"><button type="button" class="carto-scope-link" data-scope-open aria-haspopup="dialog">Ce que la carte ne couvre pas</button></p>
    </section>
  </div>


  <dialog class="carto-dialog" data-dialog aria-labelledby="carto-dialog-title">
    <div class="carto-dialog-head">
      <h2 id="carto-dialog-title" data-dialog-title></h2>
      <button type="button" class="carto-dialog-close" data-dialog-close aria-label="Fermer">×</button>
    </div>
    <div class="carto-dialog-body" data-dialog-body></div>
  </dialog>

  <script id="cartographie-data" type="application/json">{{ $data | jsonify | safeJS }}</script>
</div>
<script defer src="/js/cartographie.js?v={{ readFile "static/js/cartographie.js" | md5 }}"></script>
<script defer src="/js/cartographie-ui.js?v={{ readFile "static/js/cartographie-ui.js" | md5 }}"></script>
{{ end }}
{{ end }}
