<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ .Site.Params.siteName }}</title>

{{/* ── Meta description ── */}}
<meta name="description" content="{{ .Description | default .Site.Params.description }}">
<meta name="author" content="{{ .Site.Params.author }}">

{{/* ── Canonical ── */}}
<link rel="canonical" href="{{ .Permalink }}">

{{/* ── Langue ── */}}
<meta property="og:locale" content="fr_FR">
<link rel="alternate" hreflang="fr" href="{{ .Permalink }}">

{{/* ── Favicons ── */}}
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#F2F5F7">
<meta name="msapplication-TileColor" content="#F2F5F7">

{{/* ── Open Graph ── */}}
<meta property="og:title" content="{{ .Title | default .Site.Title }}">
<meta property="og:description" content="{{ .Description | default .Site.Params.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ .Site.Params.siteName }}">
<meta property="og:image" content="{{ "images/og-default.png" | absURL }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ .Title | default .Site.Params.siteName }}">

{{/* ── Twitter Card ── */}}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title | default .Site.Title }}">
<meta name="twitter:description" content="{{ .Description | default .Site.Params.description }}">
<meta name="twitter:image" content="{{ "images/og-default.png" | absURL }}">
<meta name="twitter:image:alt" content="{{ .Title | default .Site.Params.siteName }}">

{{/* ── Robots ── */}}
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">

{{/* ── CSS ── */}}
<link rel="stylesheet" href="/css/site-system.css?v={{ readFile "static/css/site-system.css" | md5 }}">
<link rel="stylesheet" href="/css/style.css?v={{ readFile "static/css/style.css" | md5 }}">
<script defer src="/js/site-navigation.js?v={{ readFile "static/js/site-navigation.js" | md5 }}"></script>
