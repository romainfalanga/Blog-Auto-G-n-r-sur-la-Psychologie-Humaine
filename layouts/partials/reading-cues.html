{{- if and .File (eq .Section "posts") -}}
{{- $id := strings.TrimSuffix ".md" .File.Path -}}
{{- with index .Site.Data.article_keywords $id -}}
<div class="reading-cues article-end-topics">
  {{- with .keywords }}
  <ul class="keyword-list article-keywords" aria-label="Thèmes de cette histoire">{{ range . }}<li>{{ . }}</li>{{ end }}</ul>
  {{- end }}
</div>
{{- end -}}
{{- end -}}
